version: '3.8'

services:
  # ─── High-Speed In-Memory Cache & Pub/Sub ───
  redis:
    image: redis:7-alpine
    container_name: finai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ─── Apache Kafka (KRaft Mode - No Zookeeper Required) ───
  kafka:
    image: apache/kafka:latest
    container_name: finai-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ─── FinAI Backend API ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - redis
      - kafka

  # ─── FinAI Frontend Terminal ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finai-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  redis-data:
  kafka-data:
